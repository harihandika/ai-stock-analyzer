openapi: 3.0.3
info:
  title: AI Stock Analyzer API
  description: API untuk mengambil data harga saham historis, indikator teknikal (VPA/Wyckoff), dan analisis/rekomendasi harian berbasis AI.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
tags:
  - name: Authentication
    description: Endpoint otentikasi pengguna
  - name: Stocks
    description: Operasi terkait data emiten saham
  - name: Analysis
    description: Endpoint untuk mendapatkan hasil analisis teknikal dan AI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register akun pengguna baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                full_name:
                  type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
  /auth/token:
    post:
      tags:
        - Authentication
      summary: Login pengguna untuk mendapatkan JWT Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
        '401':
          description: Email atau password salah
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Access Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '401':
          description: Token invalid
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout dan revoke token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Success
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Dapatkan profil pengguna saat ini
      responses:
        '200':
          description: Success
  /stocks:
    get:
      tags:
        - Stocks
      summary: Dapatkan daftar saham yang didukung
      responses:
        '200':
          description: Success
  /stocks/{ticker}/chart:
    get:
      tags:
        - Stocks
      summary: Dapatkan data harga riwayat (OHLCV) untuk chart
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /stocks/{ticker}/sync:
    post:
      tags:
        - Stocks
      summary: Sinkronisasi data saham dari yfinance
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /stocks/{ticker}/analysis/latest:
    get:
      tags:
        - Analysis
      summary: Dapatkan hasil analisis AI dan teknikal terbaru untuk sebuah saham
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /stocks/watchlist:
    get:
      tags:
        - Stocks
      summary: Dapatkan daftar watchlist pengguna
      responses:
        '200':
          description: Success
    post:
      tags:
        - Stocks
      summary: Tambahkan saham ke watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticker:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Created
  /stocks/watchlist/{ticker}:
    delete:
      tags:
        - Stocks
      summary: Hapus saham dari watchlist
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /analysis/{ticker}:
    post:
      tags:
        - Analysis
      summary: Jalankan AI Analysis untuk saham
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /analysis/{ticker}/backtest:
    post:
      tags:
        - Analysis
      summary: Jalankan Backtest Strategi
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                years:
                  type: integer
                target_profit_pct:
                  type: number
                stop_loss_pct:
                  type: number
      responses:
        '200':
          description: Success
  /analysis/health:
    get:
      tags:
        - Analysis
      summary: Cek status API eksternal (Claude/Redis)
      responses:
        '200':
          description: Success
